[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mfcblend"
version = "0.1.1"
description = "Vendor-neutral catalytic-reactor gas-feed planning with constrained MFCs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hyun Dong Kim"}]
keywords = [
  "catalysis",
  "gas-mixtures",
  "mass-flow-controller",
  "reaction-engineering",
  "chemical-engineering",
  "research-software",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
gui = ["matplotlib>=3.7"]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "scipy-stubs>=1.10; python_version >= '3.11'",
  "twine>=5.1",
]

[project.scripts]
mfcblend = "mfcblend.cli:main"
mfcblend-gui = "mfcblend.gui:main"

[project.urls]
Homepage = "https://github.com/hdkim99/MFCBlend"
Repository = "https://github.com/hdkim99/MFCBlend"
Issues = "https://github.com/hdkim99/MFCBlend/issues"
Documentation = "https://github.com/hdkim99/MFCBlend#readme"
Releases = "https://github.com/hdkim99/MFCBlend/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/mfcblend"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "scientific: hand-calculated or authoritative-source scientific regression test",
  "integration: cross-layer integration test",
  "gui: GUI lifecycle and application-service wiring test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mfcblend"]
