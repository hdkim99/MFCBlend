name: macOS or GUI issue
description: Report installation, Tkinter, backend, lifecycle, or export problems on macOS.
title: "[macOS/GUI]: "
labels: [macos, gui]
body:
  - type: markdown
    attributes:
      value: Do not upload confidential data. Include the full traceback after removing sensitive paths.
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: MFCBlend version
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Tk/Tcl version
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Installation method and command
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback
      render: shell
    validations:
      required: true
